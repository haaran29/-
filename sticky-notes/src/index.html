<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="style.css">
</head>
<body data-color="yellow">
  <div class="bar">
    <span class="progress" id="progress"></span>
    <button id="new" title="新しい付箋">＋</button>
    <button id="color" title="色を変える">🎨</button>
    <button id="pin" title="いつも手前に表示（オン／オフ）">📌</button>
    <button id="remove" title="この付箋を削除">✕</button>
  </div>
  <div class="palette" id="palette"></div>

  <input class="title" id="title" placeholder="タイトル" maxlength="60">

  <div class="scroll">
    <ul id="list"></ul>
    <div class="add">
      <span>＋</span>
      <input id="addInput" placeholder="やることを追加（Enter）">
    </div>
  </div>
  <button class="clear" id="clear">完了したものを消す</button>

<script src="renderer.js"></script>
</body>
</html>
