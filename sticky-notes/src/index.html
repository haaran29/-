<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>付箋</title>
<style>
  :root {
    --paper: #fff6a6;
    --bar: #f7e36b;
    --ink: #3b3520;
    --muted: #7a7150;
    --line: rgba(60, 50, 20, 0.12);
    --check: #2ea043;
  }
  body[data-color="pink"]   { --paper: #ffd9e3; --bar: #f9b8ca; }
  body[data-color="blue"]   { --paper: #d3eaff; --bar: #a9d3fb; }
  body[data-color="green"]  { --paper: #d9f5cd; --bar: #b3e6a0; }
  body[data-color="purple"] { --paper: #e8dcff; --bar: #cdb8fb; }
  body[data-color="orange"] { --paper: #ffe3c2; --bar: #fdc58a; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 "Yu Gothic UI", "Meiryo UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* つかんで動かせる上の帯 */
  .bar {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    gap: 2px;
    height: 30px;
    padding: 0 4px 0 10px;
    background: var(--bar);
    flex: none;
  }
  .progress { flex: 1; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .bar button {
    -webkit-app-region: no-drag;
    width: 26px; height: 24px;
    border: 0; border-radius: 5px;
    background: transparent;
    color: var(--ink);
    font-size: 15px; line-height: 1;
    cursor: pointer;
    opacity: 0.7;
  }
  .bar button:hover { background: rgba(0, 0, 0, 0.08); opacity: 1; }
  #pin.off { opacity: 0.3; filter: grayscale(1); }

  .palette {
    position: absolute;
    top: 32px; right: 6px;
    display: none;
    gap: 6px;
    padding: 6px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
    z-index: 10;
  }
  .palette.open { display: flex; }
  .palette button {
    width: 22px; height: 22px;
    border: 1px solid rgba(0, 0, 0, 0.15); border-radius: 50%;
    cursor: pointer;
  }

  .title {
    flex: none;
    margin: 6px 10px 2px;
    padding: 2px 0;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font: inherit; font-weight: bold; font-size: 15px;
    outline: none;
  }
  .title::placeholder { color: var(--muted); font-weight: normal; opacity: 0.7; }

  .scroll { flex: 1; overflow-y: auto; padding: 2px 0 8px; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 3px; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 3px 6px 3px 10px;
  }
  li:hover { background: rgba(0, 0, 0, 0.04); }

  .check {
    flex: none;
    width: 18px; height: 18px;
    margin-top: 2px;
    border: 2px solid var(--muted); border-radius: 4px;
    background: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    display: grid; place-items: center;
    padding: 0;
  }
  .check svg { width: 12px; height: 12px; visibility: hidden; }
  li.done .check { background: var(--check); border-color: var(--check); }
  li.done .check svg { visibility: visible; }

  .text {
    flex: 1;
    min-width: 0;
    padding: 0 2px;
    outline: none;
    word-break: break-word;
    white-space: pre-wrap;
    user-select: text;
    border-radius: 3px;
  }
  .text:focus { background: rgba(255, 255, 255, 0.5); }
  li.done .text { text-decoration: line-through; color: var(--muted); }

  .date {
    flex: none;
    margin-top: 3px;
    font-size: 11px;
    line-height: 1.5;
    color: var(--muted);
    opacity: 0.6;
    white-space: nowrap;
  }

  .del {
    flex: none;
    width: 20px; height: 20px;
    border: 0; border-radius: 4px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    visibility: hidden;
  }
  li:hover .del { visibility: visible; }
  .del:hover { background: rgba(0, 0, 0, 0.08); color: var(--ink); }

  .add {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 6px 3px 10px;
    color: var(--muted);
  }
  .add span { width: 18px; text-align: center; font-size: 16px; }
  .add input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    outline: none;
  }
  .add input::placeholder { color: var(--muted); opacity: 0.7; }

  .clear {
    display: none;
    flex: none;
    margin: 0 8px 6px auto;
    padding: 2px 8px;
    border: 0; border-radius: 5px;
    background: transparent;
    color: var(--muted);
    font: inherit; font-size: 12px;
    cursor: pointer;
  }
  .clear:hover { background: rgba(0, 0, 0, 0.08); color: var(--ink); }
  .clear.show { display: block; }
</style>
</head>
<body data-color="yellow">
  <div class="bar">
    <span class="progress" id="progress"></span>
    <button id="new" title="新しい付箋">＋</button>
    <button id="color" title="色を変える">🎨</button>
    <button id="pin" title="いつも手前に表示（オン／オフ）">📌</button>
    <button id="remove" title="この付箋を削除">✕</button>
  </div>
  <div class="palette" id="palette"></div>

  <input class="title" id="title" placeholder="タイトル" maxlength="60">

  <div class="scroll">
    <ul id="list"></ul>
    <div class="add">
      <span>＋</span>
      <input id="addInput" placeholder="やることを追加（Enter）">
    </div>
  </div>
  <button class="clear" id="clear">完了したものを消す</button>

<script>
  // Electron の外（ブラウザ）で開いたときは localStorage で動く
  const api = window.fusen || (() => {
    const key = 'fusen-preview';
    let note;
    try { note = JSON.parse(localStorage.getItem(key)); } catch {}
    note = note || { title: '', color: 'yellow', pinned: true, items: [] };
    const store = () => { try { localStorage.setItem(key, JSON.stringify(note)); } catch {} };
    return {
      get: async () => note,
      update: (patch) => { Object.assign(note, patch); store(); },
      newNote: () => {},
      remove: () => { note.items = []; note.title = ''; store(); location.reload(); },
      togglePin: async () => { note.pinned = !note.pinned; store(); return note.pinned; },
    };
  })();

  const COLORS = {
    yellow: '#fff6a6', pink: '#ffd9e3', blue: '#d3eaff',
    green: '#d9f5cd', purple: '#e8dcff', orange: '#ffe3c2',
  };
  const CHECK_SVG = '<svg viewBox="0 0 12 12"><path d="M2 6.5l2.6 2.5L10 3.2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const $ = (id) => document.getElementById(id);
  const list = $('list');
  const addInput = $('addInput');
  let items = [];
  let rendering = false;

  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const saveItems = () => api.update({ items });

  function updateProgress() {
    const done = items.filter((i) => i.done).length;
    $('progress').textContent = items.length ? `${done} / ${items.length} 完了` : '';
    $('clear').classList.toggle('show', done > 0);
  }

  function render(focusId) {
    rendering = true;
    list.textContent = '';
    rendering = false;
    for (const item of items) {
      const li = document.createElement('li');
      li.classList.toggle('done', item.done);

      const check = document.createElement('button');
      check.className = 'check';
      check.title = item.done ? 'チェックを外す' : 'チェックを入れる';
      check.innerHTML = CHECK_SVG;
      check.addEventListener('click', () => {
        item.done = !item.done;
        saveItems();
        render();
      });

      const text = document.createElement('div');
      text.className = 'text';
      text.contentEditable = 'plaintext-only';
      text.textContent = item.text;
      text.addEventListener('input', () => {
        item.text = text.textContent;
        saveItems();
      });
      text.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          addInput.focus();
        } else if (e.key === 'Backspace' && text.textContent === '') {
          e.preventDefault();
          removeItem(item);
          addInput.focus();
        }
      });
      text.addEventListener('blur', () => {
        if (!rendering && item.text.trim() === '') removeItem(item);
      });

      const date = document.createElement('span');
      date.className = 'date';
      if (item.createdAt) {
        const d = new Date(item.createdAt);
        date.textContent = formatDate(d);
        date.title = '追加：' + d.toLocaleString('ja-JP', { dateStyle: 'long', timeStyle: 'short' });
      }

      const del = document.createElement('button');
      del.className = 'del';
      del.title = '消す';
      del.textContent = '✕';
      del.addEventListener('mousedown', (e) => e.preventDefault());
      del.addEventListener('click', () => removeItem(item));

      li.append(check, text, date, del);
      list.append(li);
      if (item.id === focusId) text.focus();
    }
    updateProgress();
  }

  // 今年なら「10/17」、それより前なら「2025/10/17」
  function formatDate(d) {
    const md = `${d.getMonth() + 1}/${d.getDate()}`;
    return d.getFullYear() === new Date().getFullYear() ? md : `${d.getFullYear()}/${md}`;
  }

  function removeItem(item) {
    if (!items.includes(item)) return;
    items = items.filter((i) => i !== item);
    saveItems();
    render();
  }

  addInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const text = addInput.value.trim();
    if (!text) return;
    items.push({ id: uid(), text, done: false, createdAt: Date.now() });
    addInput.value = '';
    saveItems();
    render();
    addInput.scrollIntoView({ block: 'nearest' });
  });

  $('clear').addEventListener('click', () => {
    items = items.filter((i) => !i.done);
    saveItems();
    render();
  });

  $('title').addEventListener('input', (e) => api.update({ title: e.target.value }));
  $('title').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) addInput.focus();
  });

  // 色
  const palette = $('palette');
  for (const [name, hex] of Object.entries(COLORS)) {
    const b = document.createElement('button');
    b.style.background = hex;
    b.title = name;
    b.addEventListener('click', () => {
      document.body.dataset.color = name;
      api.update({ color: name });
      palette.classList.remove('open');
    });
    palette.append(b);
  }
  $('color').addEventListener('click', (e) => {
    e.stopPropagation();
    palette.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!palette.contains(e.target)) palette.classList.remove('open');
  });

  const showPin = (on) => {
    $('pin').classList.toggle('off', !on);
    $('pin').title = on ? 'いつも手前に表示：オン（押すとオフ）' : 'いつも手前に表示：オフ（押すとオン）';
  };
  $('pin').addEventListener('click', async () => showPin(await api.togglePin()));
  $('new').addEventListener('click', () => api.newNote());
  $('remove').addEventListener('click', () => {
    const hasContent = items.length > 0 || $('title').value.trim() !== '';
    if (!hasContent || confirm('この付箋を削除しますか？')) api.remove();
  });

  api.get().then((note) => {
    if (!note) return;
    items = Array.isArray(note.items) ? note.items : [];
    $('title').value = note.title || '';
    document.body.dataset.color = COLORS[note.color] ? note.color : 'yellow';
    showPin(note.pinned !== false);
    render();
    if (!items.length) addInput.focus();
  });
</script>
</body>
</html>
