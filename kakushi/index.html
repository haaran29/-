<!doctype html><html lang="ja"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style><meta name="apple-mobile-web-app-title" content="写真かくし"></head><body>
<title>写真かくし</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 左に写真（なぞって隠す）、右に道具パネル。スマホでは縦に積む */
:root{
  --ground:#edf0f4; --panel:#ffffff; --ink:#1e2430; --muted:#5f6878;
  --line:#d3d9e2; --soft:#f4f6f9; --accent:#d23f72; --accent-ink:#ffffff;
  --accent-soft:#fbe3ec; --stage:#dfe4eb; --focus:#f08bb0;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#14171d; --panel:#1d2129; --ink:#e8ebf1; --muted:#a2aaba;
  --line:#343a46; --soft:#252a34; --accent:#ff6f9c; --accent-ink:#22060f;
  --accent-soft:#3b1d29; --stage:#0d0f13; --focus:#ff9dbd; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#14171d; --panel:#1d2129; --ink:#e8ebf1; --muted:#a2aaba;
  --line:#343a46; --soft:#252a34; --accent:#ff6f9c; --accent-ink:#22060f;
  --accent-soft:#3b1d29; --stage:#0d0f13; --focus:#ff9dbd; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6}
.app{max-width:1180px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font-family:var(--display);font-size:1.7rem;margin:0;letter-spacing:.02em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.9rem}
.stage-wrap{min-width:0;display:grid;gap:10px}
.stage{position:relative;background:var(--stage);border-radius:16px;padding:12px;min-height:260px;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage.drop{outline:3px dashed var(--accent);outline-offset:-8px}
canvas#cv{display:block;touch-action:none;cursor:crosshair;border-radius:3px;box-shadow:0 2px 10px rgba(0,0,0,.18);max-width:100%}
.badge{position:absolute;bottom:20px;left:20px;background:var(--panel);color:var(--ink);font-size:.8rem;
  padding:3px 10px;border-radius:99px;box-shadow:0 1px 4px rgba(0,0,0,.2);pointer-events:none}
.hint{margin:0;color:var(--muted);font-size:.88rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:18px;min-width:0}
.group{display:grid;gap:8px}
.label{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
button,.filebtn{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.filebtn:focus-within,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:1rem;width:100%}
.primary:hover{filter:brightness(1.05)}
.filebtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--accent);color:var(--accent);
  border-radius:12px;padding:10px 14px;font-weight:700;background:transparent;position:relative}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{border:1.5px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 2px 6px;
  display:grid;justify-items:center;gap:4px;font-size:.8rem;white-space:nowrap}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.ico{width:26px;height:26px;border-radius:50%;display:block}
.ico.blur{background:radial-gradient(circle,#c98b6b 0 30%,transparent 72%)}
.ico.mosaic{border-radius:4px;background:
  conic-gradient(#b67a5c 25%,#e2b190 0 50%,#b67a5c 0 75%,#e2b190 0) 0 0/13px 13px}
.ico.fill{background:var(--ink)}
.ico.stamp{font-size:22px;line-height:26px;text-align:center}
.ico.ellipse{border:2.5px solid currentColor}
.ico.rect{border:2.5px solid currentColor;border-radius:4px;width:30px;height:24px}
input[type=range]{width:100%;accent-color:var(--accent)}
.range-ends{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:-6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--accent)}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.emojis button{font-size:24px;line-height:1;padding:6px 0;border-radius:10px;border:1.5px solid transparent;background:var(--soft)}
.emojis button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.ghost{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;font-size:.88rem}
.ghost:disabled{opacity:.45;cursor:default}
.danger{color:var(--accent);border-color:var(--accent)}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:.78rem;color:var(--muted);margin:0}
.sheet{position:fixed;inset:0;background:rgba(10,12,16,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-card{background:var(--panel);border-radius:18px;padding:16px;max-width:720px;width:100%;max-height:100%;display:grid;gap:12px;overflow:auto}
.sheet-card h2{font-family:var(--display);font-size:1.2rem;margin:0}
.sheet-card img{width:100%;max-height:60vh;object-fit:contain;background:var(--stage);border-radius:10px;-webkit-touch-callout:default}
.toast{min-height:1.4em;font-size:.85rem;color:var(--accent);margin:0}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  h1{font-size:1.45rem}
}
@media (prefers-reduced-motion:no-preference){.seg button,.emojis button,.swatches button{transition:background .15s,border-color .15s}}
</style>

<div class="app">
  <header>
    <h1>写真かくし</h1>
    <p>顔や名前など、見せたくないところをぼかし・モザイク・スタンプで隠します</p>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="写真。なぞった場所が隠れます"></canvas>
      <span class="badge" id="badge">見本の画像です</span>
    </div>
    <p class="hint">隠したいところを<b>指やマウスでなぞって囲む</b>か、<b>タップ</b>してください。隠した場所はドラッグで動かせて、角をつまむと大きさを変えられます。</p>
  </div>

  <aside class="panel">
    <label class="filebtn" for="file">写真を選ぶ
      <input type="file" id="file" accept="image/*">
    </label>

    <div class="group">
      <span class="label">かくし方</span>
      <div class="seg" id="kinds">
        <button type="button" data-kind="blur"><span class="ico blur"></span>ぼかし</button>
        <button type="button" data-kind="mosaic"><span class="ico mosaic"></span>モザイク</button>
        <button type="button" data-kind="fill"><span class="ico fill"></span>ぬりつぶし</button>
        <button type="button" data-kind="stamp"><span class="ico stamp">😊</span>スタンプ</button>
      </div>
    </div>

    <div class="group" id="g-shape">
      <span class="label">形</span>
      <div class="seg two" id="shapes">
        <button type="button" data-shape="ellipse"><span class="ico ellipse"></span>丸</button>
        <button type="button" data-shape="rect"><span class="ico rect"></span>四角</button>
      </div>
    </div>

    <div class="group" id="g-strength">
      <label class="label" for="strength">強さ</label>
      <input type="range" id="strength" min="1" max="5" step="1" value="3">
      <div class="range-ends"><span>うすく</span><span>しっかり</span></div>
    </div>

    <div class="group" id="g-color" hidden>
      <span class="label">色</span>
      <div class="swatches" id="colors"></div>
    </div>

    <div class="group" id="g-emoji" hidden>
      <span class="label">スタンプ</span>
      <div class="emojis" id="emojis"></div>
    </div>

    <div class="group">
      <span class="count" id="count">隠した場所：0か所</span>
      <div class="row">
        <button type="button" class="ghost danger" id="del" disabled>選んだ所を消す</button>
      </div>
      <div class="row">
        <button type="button" class="ghost" id="undo" disabled>元に戻す</button>
        <button type="button" class="ghost" id="clear" disabled>全部はずす</button>
      </div>
    </div>

    <button type="button" class="primary" id="save">隠した写真を保存</button>
    <p class="note">写真はこの画面の中だけで処理され、どこにも送られません。保存した画像には撮影場所などの情報は残りません。</p>
  </aside>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">できあがり</h2>
    <img id="result" alt="隠したあとの写真">
    <p class="note">保存できないときは、画像を長押し（パソコンは右クリック）して「画像を保存」を選んでください。</p>
    <p class="toast" id="toast" aria-live="polite"></p>
    <div class="row">
      <button type="button" class="primary" id="dl" style="flex:2">画像を保存</button>
      <button type="button" class="ghost" id="close">閉じる</button>
    </div>
  </div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d'), stage = $('#stage');
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const EMOJIS = ['😊','😎','🙂','😺','🐶','🐻','🐰','🐼','⭐','❤️','🌸','🍀'];
const COLORS = ['#1e2430','#ffffff','#f6a5c0','#ffd54a','#8fc7ff','#7a5a45'];
const BLUR_N = [16, 12, 9, 7, 5];     // 短い辺をいくつに分けるか（少ないほど強い）
const MOSAIC_N = [16, 12, 9, 6, 4];

let src = null, iw = 0, ih = 0, base = null, k = 1, cssScale = 1, dpr = 1;
let regions = [], sel = null, history = [], drag = null, nextId = 1;
let fileName = 'photo', fileType = 'image/jpeg';
const st = { kind: 'blur', shape: 'ellipse', strength: 3, color: COLORS[0], emoji: EMOJIS[0] };

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };

// 大きい画像をなめらかに縮める（半分ずつ縮めてギザギザを防ぐ）
function sample(img, sx, sy, sw, sh, tw, th) {
  let c = img, x = sx, y = sy, w = sw, h = sh;
  while (w / 2 > tw && h / 2 > th) {
    const t = mk(w / 2, h / 2), tc = t.getContext('2d');
    tc.imageSmoothingQuality = 'high';
    tc.drawImage(c, x, y, w, h, 0, 0, t.width, t.height);
    c = t; x = 0; y = 0; w = t.width; h = t.height;
  }
  const o = mk(tw, th), oc = o.getContext('2d');
  oc.imageSmoothingQuality = 'high';
  oc.drawImage(c, x, y, w, h, 0, 0, o.width, o.height);
  return o;
}

function shapePath(c, x, y, w, h, shape) {
  c.beginPath();
  if (shape === 'ellipse') c.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
  else c.rect(x, y, w, h);
}

function pixelate(c, img, r, s, smooth) {
  const X = r.x * s, Y = r.y * s, W = r.w * s, H = r.h * s;
  const x0 = Math.max(0, X), y0 = Math.max(0, Y);
  const x1 = Math.min(img.width, X + W), y1 = Math.min(img.height, Y + H);
  if (x1 - x0 < 1 || y1 - y0 < 1) return;
  const n = (smooth ? BLUR_N : MOSAIC_N)[r.strength - 1];
  const cell = Math.min(W, H) / n;
  let small = sample(img, x0, y0, x1 - x0, y1 - y0, Math.max(1, (x1 - x0) / cell), Math.max(1, (y1 - y0) / cell));
  if (smooth) {  // 2段階で引きのばして、ぼかしをやわらかくする
    const mid = mk(small.width * 3, small.height * 3), mc = mid.getContext('2d');
    mc.imageSmoothingQuality = 'high';
    mc.drawImage(small, 0, 0, mid.width, mid.height);
    small = mid;
  }
  c.save();
  shapePath(c, X, Y, W, H, r.shape);
  c.clip();
  c.imageSmoothingEnabled = smooth;
  c.imageSmoothingQuality = 'high';
  c.drawImage(small, 0, 0, small.width, small.height, x0, y0, x1 - x0, y1 - y0);
  c.restore();
}

// 絵文字は文字の幅や高さの情報が見た目とずれることがあるので（❤️など）、
// 一度描いて実際に色がついた範囲を切り出し、それを真ん中に置く
const emojiCache = {};
function emojiImage(em) {
  if (emojiCache[em]) return emojiCache[em];
  // 端末によっては絵文字が大きく右にずれて描かれるので、広いキャンバスに左から余裕をもって描く
  const S = 640, t = mk(S, S), tc = t.getContext('2d', { willReadFrequently: true });
  tc.font = `160px ${EMOJI_FONT}`; tc.textAlign = 'left'; tc.textBaseline = 'middle';
  tc.fillText(em, 160, S / 2);
  const d = tc.getImageData(0, 0, S, S).data;
  let x0 = S, y0 = S, x1 = -1, y1 = -1;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    if (d[(y * S + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return null;
  const o = mk(x1 - x0 + 1, y1 - y0 + 1);
  o.getContext('2d').drawImage(t, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return (emojiCache[em] = o);
}

function drawStamp(c, r, s) {
  const im = emojiImage(r.emoji);
  if (!im) return;
  const box = Math.min(r.w, r.h) * s * 0.92, f = box / Math.max(im.width, im.height);
  const w = im.width * f, h = im.height * f;
  c.save();
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
  c.drawImage(im, (r.x + r.w / 2) * s - w / 2, (r.y + r.h / 2) * s - h / 2, w, h);
  c.restore();
}

// img は「元の写真を s 倍した大きさ」のキャンバス。表示用と保存用で同じ処理を使う
function renderTo(c, img, s) {
  c.drawImage(img, 0, 0);
  for (const r of regions) {
    if (r.kind === 'blur') pixelate(c, img, r, s, true);
    else if (r.kind === 'mosaic') pixelate(c, img, r, s, false);
    else if (r.kind === 'fill') { shapePath(c, r.x * s, r.y * s, r.w * s, r.h * s, r.shape); c.fillStyle = r.color; c.fill(); }
    else drawStamp(c, r, s);
  }
}

function corners(r) { return [[r.x, r.y], [r.x + r.w, r.y], [r.x, r.y + r.h], [r.x + r.w, r.y + r.h]]; }

function draw() {
  if (!src) return;
  renderTo(ctx, base, k);
  if (!sel) return;
  const x = sel.x * k, y = sel.y * k, w = sel.w * k, h = sel.h * k;
  ctx.save();
  ctx.lineWidth = 3 * dpr; ctx.strokeStyle = 'rgba(0,0,0,.55)';
  ctx.strokeRect(x, y, w, h);
  ctx.lineWidth = 1.5 * dpr; ctx.strokeStyle = '#fff'; ctx.setLineDash([6 * dpr, 4 * dpr]);
  ctx.strokeRect(x, y, w, h);
  ctx.setLineDash([]);
  for (const [cx, cy] of corners(sel)) {
    ctx.beginPath(); ctx.arc(cx * k, cy * k, 8 * dpr, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 2.5 * dpr; ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#d23f72'; ctx.stroke();
  }
  ctx.restore();
}

function fit() {
  if (!src) return;
  const availW = stage.clientWidth - 24;
  const availH = Math.max(220, Math.min(window.innerHeight * (window.innerWidth < 820 ? 0.58 : 0.74), 900));
  let w = availW, h = w * ih / iw;
  if (h > availH) { h = availH; w = h * iw / ih; }
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cssScale = w / iw; k = cv.width / iw;
  base = sample(src, 0, 0, iw, ih, cv.width, cv.height);
  draw();
}

function setSource(canvas, preset) {
  src = canvas; iw = canvas.width; ih = canvas.height;
  regions = preset || []; history = []; sel = null;
  fit(); updatePanel();
}

// ---------- 見本の画像（公園の2人） ----------
function makeSample() {
  const c = mk(1200, 800), g = c.getContext('2d');
  let gr = g.createLinearGradient(0, 0, 0, 520);
  gr.addColorStop(0, '#9fd0f0'); gr.addColorStop(1, '#e3f2fb');
  g.fillStyle = gr; g.fillRect(0, 0, 1200, 800);
  g.fillStyle = '#ffffff';
  for (const [x, y, s] of [[180, 120, 1], [930, 90, 1.3]]) {
    g.beginPath(); g.arc(x, y, 34 * s, 0, 7); g.arc(x + 40 * s, y - 14 * s, 42 * s, 0, 7); g.arc(x + 86 * s, y, 32 * s, 0, 7); g.fill();
  }
  gr = g.createLinearGradient(0, 520, 0, 800);
  gr.addColorStop(0, '#9ccc76'); gr.addColorStop(1, '#6da84f');
  g.fillStyle = gr; g.fillRect(0, 520, 1200, 280);
  g.fillStyle = '#8a6244'; g.fillRect(1030, 300, 34, 260);
  g.fillStyle = '#4f9a50';
  for (const [x, y, r] of [[1047, 260, 95], [985, 320, 70], [1110, 320, 72]]) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  const person = (x, shirt, hair, long) => {
    g.fillStyle = shirt;
    g.beginPath(); g.roundRect(x - 115, 470, 230, 330, [90, 90, 20, 20]); g.fill();
    g.fillStyle = '#f0c6a2'; g.fillRect(x - 26, 400, 52, 80);
    if (long) { g.fillStyle = hair; g.beginPath(); g.roundRect(x - 92, 270, 184, 230, 80); g.fill(); }
    g.fillStyle = '#f3caa6'; g.beginPath(); g.ellipse(x, 340, 80, 92, 0, 0, 7); g.fill();
    g.fillStyle = hair; g.beginPath(); g.ellipse(x, 290, 86, 58, 0, Math.PI, 0); g.fill();
    g.fillStyle = '#2b2422';
    g.beginPath(); g.arc(x - 28, 345, 8, 0, 7); g.arc(x + 28, 345, 8, 0, 7); g.fill();
    g.strokeStyle = '#a2523e'; g.lineWidth = 6; g.lineCap = 'round';
    g.beginPath(); g.arc(x, 368, 24, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();
    g.fillStyle = 'rgba(240,120,110,.35)';
    g.beginPath(); g.arc(x - 50, 375, 14, 0, 7); g.arc(x + 50, 375, 14, 0, 7); g.fill();
  };
  person(400, '#e46f7a', '#3a2a24', true);
  person(760, '#4d7fc4', '#22201f', false);
  g.fillStyle = '#ffffff'; g.beginPath(); g.roundRect(705, 600, 110, 44, 8); g.fill();
  g.fillStyle = '#1e2430'; g.font = 'bold 26px sans-serif'; g.textAlign = 'center'; g.fillText('山田', 760, 632);
  return {
    canvas: c,
    regions: [
      { id: nextId++, kind: 'blur', shape: 'ellipse', strength: 3, x: 300, y: 228, w: 200, h: 220, color: COLORS[0], emoji: EMOJIS[0] },
      { id: nextId++, kind: 'stamp', shape: 'ellipse', strength: 3, x: 665, y: 250, w: 190, h: 190, color: COLORS[0], emoji: '😊' },
      { id: nextId++, kind: 'mosaic', shape: 'rect', strength: 4, x: 698, y: 594, w: 124, h: 56, color: COLORS[0], emoji: EMOJIS[0] },
    ],
  };
}

// ---------- 写真を読み込む ----------
function loadFile(file) {
  if (!file) return;
  if (!/^image\//.test(file.type) && !/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(file.name)) { flash('画像のファイルを選んでください。'); return; }
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    let w = im.naturalWidth, h = im.naturalHeight;
    const max = 12e6;  // スマホのメモリ上限に収まる大きさまで縮める
    if (w * h > max) { const f = Math.sqrt(max / (w * h)); w = Math.round(w * f); h = Math.round(h * f); }
    const c = mk(w, h); c.getContext('2d').drawImage(im, 0, 0, w, h);
    URL.revokeObjectURL(url);
    fileName = (file.name || 'photo').replace(/\.[^.]+$/, '');
    fileType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
    $('#badge').hidden = true;
    setSource(c, []);
  };
  im.onerror = () => { URL.revokeObjectURL(url); flash('この写真は開けませんでした。JPEG か PNG の写真を選んでください。'); };
  im.src = url;
}
function flash(msg) { $('#count').textContent = msg; setTimeout(updatePanel, 3500); }

$('#file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('drop'); });
stage.addEventListener('dragleave', () => stage.classList.remove('drop'));
stage.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('drop'); loadFile(e.dataTransfer.files[0]); });
document.addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) loadFile(item.getAsFile());
});

// ---------- なぞる・動かす・大きさを変える ----------
const snap = () => JSON.stringify(regions);
function commit(before) {
  if (before === snap()) return;
  history.push(before); if (history.length > 60) history.shift();
  updatePanel();
}
function pt(e) { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) / cssScale, y: (e.clientY - b.top) / cssScale }; }
function handleAt(p) {
  if (!sel) return -1;
  const tol = 18 / cssScale;
  return corners(sel).findIndex(([x, y]) => Math.hypot(p.x - x, p.y - y) < tol);
}
function hit(p) {
  for (let i = regions.length - 1; i >= 0; i--) {
    const r = regions[i];
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return r;
  }
  return null;
}
function newRegion(x, y, w, h) {
  return { id: nextId++, kind: st.kind, shape: st.shape, strength: st.strength, color: st.color, emoji: st.emoji, x, y, w, h };
}
function select(r) {
  sel = r;
  if (r) Object.assign(st, { kind: r.kind, shape: r.shape, strength: r.strength, color: r.color, emoji: r.emoji });
  updatePanel(); draw();
}

cv.addEventListener('pointerdown', e => {
  if (!src) return;
  cv.setPointerCapture(e.pointerId);
  const p = pt(e), before = snap();
  const h = handleAt(p);
  if (h >= 0) {
    const [ax, ay] = corners(sel)[3 - h];
    drag = { mode: 'resize', r: sel, ax, ay, before };
    return;
  }
  const r = hit(p);
  if (r) {
    regions.splice(regions.indexOf(r), 1); regions.push(r);  // 選んだものを一番上に
    select(r);
    drag = { mode: 'move', r, ox: p.x - r.x, oy: p.y - r.y, before };
    return;
  }
  drag = { mode: 'new', sx: p.x, sy: p.y, r: null, hadSel: !!sel, before };
});

cv.addEventListener('pointermove', e => {
  if (!src) return;
  const p = pt(e);
  if (!drag) {
    if (e.pointerType === 'mouse') {
      const h = handleAt(p);
      cv.style.cursor = h === 0 || h === 3 ? 'nwse-resize' : h > 0 ? 'nesw-resize' : hit(p) ? 'move' : 'crosshair';
    }
    return;
  }
  const min = 14 / cssScale;
  if (drag.mode === 'move') {
    drag.r.x = p.x - drag.ox; drag.r.y = p.y - drag.oy;
  } else if (drag.mode === 'resize' || drag.mode === 'new') {
    const ax = drag.mode === 'new' ? drag.sx : drag.ax, ay = drag.mode === 'new' ? drag.sy : drag.ay;
    if (drag.mode === 'new' && !drag.r) {
      if (Math.hypot(p.x - ax, p.y - ay) * cssScale < 8) return;
      drag.r = newRegion(ax, ay, 1, 1); regions.push(drag.r); select(drag.r);
    }
    const r = drag.r;
    let w = Math.max(min, Math.abs(p.x - ax)), h = Math.max(min, Math.abs(p.y - ay));
    if (r.kind === 'stamp') w = h = Math.max(w, h);
    r.w = w; r.h = h;
    r.x = p.x < ax ? ax - w : ax;
    r.y = p.y < ay ? ay - h : ay;
  }
  draw();
});

function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.mode === 'new' && !d.r && e.type === 'pointerup') {
    if (d.hadSel) { select(null); return; }
    const s = Math.min(iw, ih) * 0.18;  // タップだけなら、その場所に丸を置く
    const r = newRegion(d.sx - s / 2, d.sy - s / 2, s, s);
    regions.push(r); select(r);
  }
  commit(d.before); draw();
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// ---------- パネル ----------
const colorsEl = $('#colors'), emojisEl = $('#emojis');
COLORS.forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.dataset.color = c; b.style.background = c; b.setAttribute('aria-label', '色 ' + c); colorsEl.append(b); });
EMOJIS.forEach(em => { const b = document.createElement('button'); b.type = 'button'; b.dataset.emoji = em; b.textContent = em; emojisEl.append(b); });

function change(prop, val) {
  const before = snap();
  st[prop] = val;
  if (sel) {
    sel[prop] = val;
    if (prop === 'kind' && val === 'stamp') {  // スタンプは正方形にそろえる
      const s = Math.max(sel.w, sel.h), cx = sel.x + sel.w / 2, cy = sel.y + sel.h / 2;
      Object.assign(sel, { w: s, h: s, x: cx - s / 2, y: cy - s / 2 });
    }
    commit(before);
  }
  updatePanel(); draw();
}
$('#kinds').addEventListener('click', e => { const b = e.target.closest('button'); if (b) change('kind', b.dataset.kind); });
$('#shapes').addEventListener('click', e => { const b = e.target.closest('button'); if (b) change('shape', b.dataset.shape); });
colorsEl.addEventListener('click', e => { const b = e.target.closest('button'); if (b) change('color', b.dataset.color); });
emojisEl.addEventListener('click', e => { const b = e.target.closest('button'); if (b) change('emoji', b.dataset.emoji); });
$('#strength').addEventListener('input', e => {
  st.strength = +e.target.value;
  if (sel) { if (!drag) drag = { mode: 'slider', before: snap() }; sel.strength = st.strength; draw(); }
});
$('#strength').addEventListener('change', () => { if (drag && drag.mode === 'slider') { const b = drag.before; drag = null; commit(b); } });

function removeSel() {
  if (!sel) return;
  const before = snap();
  regions.splice(regions.indexOf(sel), 1); sel = null;
  commit(before); updatePanel(); draw();
}
$('#del').addEventListener('click', removeSel);
$('#undo').addEventListener('click', undo);
$('#clear').addEventListener('click', () => { const before = snap(); regions = []; sel = null; commit(before); updatePanel(); draw(); });
function undo() {
  if (!history.length) return;
  const keep = sel && sel.id;
  regions = JSON.parse(history.pop());
  sel = regions.find(r => r.id === keep) || null;
  updatePanel(); draw();
}
document.addEventListener('keydown', e => {
  if (e.target.closest('input') || !$('#sheet').hidden) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel) { e.preventDefault(); removeSel(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  if (e.key === 'Escape' && sel) select(null);
});

function updatePanel() {
  document.querySelectorAll('#kinds button').forEach(b => b.setAttribute('aria-pressed', b.dataset.kind === st.kind));
  document.querySelectorAll('#shapes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.shape === st.shape));
  colorsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.color === st.color));
  emojisEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.emoji === st.emoji));
  $('#strength').value = st.strength;
  $('#g-shape').hidden = st.kind === 'stamp';
  $('#g-strength').hidden = !(st.kind === 'blur' || st.kind === 'mosaic');
  $('#g-color').hidden = st.kind !== 'fill';
  $('#g-emoji').hidden = st.kind !== 'stamp';
  $('#count').textContent = `隠した場所：${regions.length}か所` + (sel ? '（1つ選択中）' : '');
  $('#del').disabled = !sel;
  $('#undo').disabled = !history.length;
  $('#clear').disabled = !regions.length;
}

// ---------- 保存 ----------
let resultBlob = null, resultUrl = null;
$('#save').addEventListener('click', () => {
  if (!src) return;
  const out = mk(iw, ih);
  renderTo(out.getContext('2d'), src, 1);
  out.toBlob(blob => {
    if (!blob) { flash('画像を作れませんでした。写真を小さくしてもう一度ためしてください。'); return; }
    resultBlob = blob;
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl = URL.createObjectURL(blob);
    $('#result').src = resultUrl;
    $('#toast').textContent = '';
    $('#sheet').hidden = false;
    $('#dl').focus();
  }, fileType, 0.92);
});
$('#dl').addEventListener('click', async () => {
  const name = `${fileName}-かくし.${fileType === 'image/png' ? 'png' : 'jpg'}`;
  const dls = window.claude?.use ? await window.claude.use('downloads') : null;
  if (dls) {  // Claude の画面の中では、この方法でしか保存できない
    try { await dls.save({ filename: name, data: resultBlob }); $('#toast').textContent = '保存しました。'; }
    catch (err) { $('#toast').textContent = err.code === 'declined' ? '' : '保存できませんでした。画像を長押しして保存してください。'; }
    return;
  }
  const file = new File([resultBlob], name, { type: fileType });
  if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (err) { if (err.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = resultUrl; a.download = name;
  document.body.append(a); a.click(); a.remove();
  $('#toast').textContent = '保存を始めました。始まらないときは、画像を長押しして保存してください。';
});
$('#close').addEventListener('click', () => { $('#sheet').hidden = true; $('#save').focus(); });
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('#sheet').hidden = true; });

let lastW = 0;
new ResizeObserver(() => { if (stage.clientWidth !== lastW) { lastW = stage.clientWidth; fit(); } }).observe(stage);
window.addEventListener('resize', fit);
const s = makeSample();
setSource(s.canvas, s.regions);
})();
</script>

</body></html>
