name: 付箋アプリをつくる

on:
  push:
    paths:
      - 'sticky-notes/**'
      - '.github/workflows/sticky-notes.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            files: |
              sticky-notes/dist/*.exe
          - os: macos-latest
            target: mac
            files: |
              sticky-notes/dist/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sticky-notes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sticky-notes/package-lock.json
      - run: npm ci
      - run: npm run build:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: FusenTodo-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
